name: seal-build

on:
  workflow_dispatch:

jobs:
  package:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.7"
      - name: Install pinned build backend
        run: python -m pip install "setuptools==41.0.0" "wheel==0.30.0"
      - name: Build sdist and wheel
        # setuptools 41 keeps Provides-Extra in a set; a fixed hash seed
        # reproduces the published PKG-INFO order (secure, socks).
        env:
          PYTHONHASHSEED: "0"
        run: python setup.py sdist bdist_wheel
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/*
