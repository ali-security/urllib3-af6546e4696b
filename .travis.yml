language: python
os: linux
dist: xenial
script:
  - ./_travis/run.sh
before_install:
  - openssl version
  # The dummyserver test certificates (dummyserver/certs) expired in 2021;
  # _travis/run.sh runs the suite under faketime at the release date. Build
  # libfaketime 0.9.10 rather than xenial's 0.9.6 package: 0.9.6 does not
  # intercept sem_timedwait, so Python 3's threading.Event.wait(5) times out
  # at once and every socket-level dummyserver fails to start.
  - git clone --depth 1 --branch v0.9.10 https://github.com/wolfcw/libfaketime.git /tmp/libfaketime
  - make -C /tmp/libfaketime
  - sudo make -C /tmp/libfaketime install
  - command -v faketime
  # test_dotted_fqdn / test_request_host_header_ignores_fqdn_dot connect to
  # "localhost." (trailing dot), which xenial's resolver does not map to loopback.
  - echo "127.0.0.1 localhost." | sudo tee -a /etc/hosts
install:
  - ./_travis/install.sh
notifications:
  email: false
env:
  global:
    - PYTHONWARNINGS=always::DeprecationWarning
    # Registry time machine. 2022-07-15, not the 2019-04-17 release date: pytest
    # needs atomicwrites, whose whole PyPI file history was re-uploaded on
    # 2022-07-09, so earlier dates find no atomicwrites distribution.
    - PIP_INDEX_URL=https://:2022-07-15@time-machines-pypi.sealsecurity.io/
jobs:
  include:
    - python: 2.7
      env: TOXENV=py27
    - python: 3.4
      env: TOXENV=py34
    - python: 3.5
      env: TOXENV=py35
    - python: 3.6
      env: TOXENV=py36
    - python: 3.7
      env: TOXENV=py37
